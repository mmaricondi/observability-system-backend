version: "3.8"
services:
  api:
    build: .
    container_name: nest-api
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://clickcannabis:123456@db:5432/services

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: clickcannabis
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: services
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
